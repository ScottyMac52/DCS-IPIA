name: CI

on:
  push:
    branches: [main]
  # Validate dependent PRs before their base feature branch is merged.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    # Provider PR #3: collect Cobertura/OpenCover and TRX with the existing 80/80 gates.
    uses: ScottyMac52/shared-github-workflows/.github/workflows/reusable-dotnet-ci.yml@2bb8c9233fe456e94fe1627f41e24df8e881ceb2
    with:
      dotnet_version: 10.0.x
      test_project: tests/Heimdall.Tests/Heimdall.Tests.csproj
      presentation_project: src/Heimdall.App/Heimdall.App.csproj
      coverage_include: '[Heimdall.Domain]*%2c[Heimdall.Application]*%2c[Heimdall.Infrastructure]*%2c[Heimdall.Dcs]*%2c[Heimdall.EliteDangerous]*%2c[Heimdall.Squadrons]*%2c[Heimdall.Rendering]*%2c[Heimdall.Packaging]*'
      line_threshold: 80
      branch_threshold: 80

  solution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test local PowerShell runner failure paths
        shell: pwsh
        run: ./tests/ci/Test-LocalTestSupport.ps1
      - name: Test owner license issuer with ephemeral keys
        shell: pwsh
        run: ./tests/ci/Test-OwnerLicenseIssuer.ps1
      - name: Test release cleanup and uninstaller completion
        shell: pwsh
        run: ./tests/installer/Test-ReleaseCleanup.ps1
      - name: Test exact runtime notice selection and missing-evidence failures
        shell: pwsh
        run: ./tests/installer/Test-RuntimePackNotices.ps1
      - name: Build Visual Studio solution
        id: solution_build
        run: dotnet build HEIMDALL.sln --configuration Release
      - name: Test setup folder defaults and appsettings persistence
        shell: powershell
        run: ./tests/installer/Test-SavedGamesSettings.ps1
      - name: Open WPF previews and complete both interactive training scenarios
        timeout-minutes: 6
        env:
          HEIMDALL_MAPPING_PREVIEW: ${{ runner.temp }}/custom-mapping-preview
        run: dotnet run --project tests/Heimdall.App.Smoke/Heimdall.App.Smoke.csproj --configuration Release --no-build
      - name: Run tests on Windows
        if: ${{ !cancelled() && steps.solution_build.outcome == 'success' }}
        env:
          HEIMDALL_PARITY_OUTPUT: ${{ runner.temp }}/huey-parity
          HEIMDALL_MAPPING_PREVIEW: ${{ runner.temp }}/custom-mapping-preview
        run: dotnet test tests/Heimdall.Tests/Heimdall.Tests.csproj --configuration Release --no-build --logger trx --results-directory "${{ runner.temp }}/windows-test-results"
      - name: Upload custom mapping visual review
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: custom-mapping-preview
          path: ${{ runner.temp }}/custom-mapping-preview
          if-no-files-found: warn
      - name: Upload Windows test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-test-results
          path: ${{ runner.temp }}/windows-test-results/**/*.trx
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: huey-release-parity
          path: ${{ runner.temp }}/huey-parity
          if-no-files-found: warn

  # Structural layout and documentation checks restored after the refactor cleanup (#219).
  csharp-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check C# type and documentation layout
        run: python3 scripts/check_csharp_layout.py
      - name: Check documentation links and release-note version
        run: python3 scripts/check_documentation.py
      - name: Check Flight Patch brand assets and packaging
        run: python3 scripts/check_branding_assets.py
      - name: Check WPF theme resource contract
        run: python3 scripts/check_theme_resources.py

      - name: Check pinned Common capability inventory
        run: python3 scripts/check_common_migration.py --check
      - name: Test migration inventory failure paths
        run: python3 -m unittest discover -s tests/migration -p 'test_*.py'
      - name: Test CI report calculations and failure paths
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'

  test-reports:
    if: ${{ !cancelled() }}
    name: Publish test results, coverage, and CRAP scores
    needs: [dotnet, solution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download Linux coverage and test results
        id: coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: TestResults/raw/linux
      - name: Download Windows test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: windows-test-results
          path: TestResults/raw/windows
      - name: Install pinned ReportGenerator
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path "${{ runner.temp }}/reportgenerator" --version 5.5.11
      - name: Generate HTML coverage and machine-readable summaries
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: >-
          "${{ runner.temp }}/reportgenerator/reportgenerator"
          "-reports:TestResults/raw/linux/**/*.opencover.xml"
          "-targetdir:TestResults/report"
          "-sourcedirs:${{ github.workspace }}"
          "-reporttypes:Html;Cobertura;MarkdownSummaryGithub;JsonSummary;CsvSummary"
      - name: Publish test outcomes and method risk scores
        if: ${{ always() && !cancelled() }}
        env:
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          WINDOWS_RESULT: ${{ needs.solution.result }}
        run: |
          mkdir -p TestResults/report
          {
            echo '## CI quality gates'
            echo ''
            echo "Linux build/test/80% line and branch gates: **$DOTNET_RESULT**"
            echo "Windows solution/test/smoke: **$WINDOWS_RESULT**"
            echo ''
            if [ -f TestResults/report/SummaryGithub.md ]; then
              cat TestResults/report/SummaryGithub.md
            else
              echo 'HTML coverage summary unavailable. See reporting errors and raw artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          python scripts/publish_test_results.py --raw TestResults/raw --output TestResults/report --summary "$GITHUB_STEP_SUMMARY"
      - name: Enforce independent 80/80 coverage and method CRAP ceiling
        if: ${{ always() && !cancelled() }}
        run: >-
          python scripts/assert_quality_gates.py
          --coverage TestResults/report/Cobertura.xml
          --raw TestResults/raw/linux
          --output TestResults/report
          --summary "$GITHUB_STEP_SUMMARY"
          --crap-ceiling 50
      - name: Upload full coverage, CRAP, and test results
        id: report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: TestResults
          retention-days: 30
          if-no-files-found: error
      - name: Link published report
        if: ${{ always() && steps.report.outcome == 'success' }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download HTML coverage, CRAP scores, and test results]($REPORT_URL) — open report/index.html after extraction for searchable CRAP, complexity, line coverage, and branch coverage in one table." >> "$GITHUB_STEP_SUMMARY"

  asset-authoring:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test exporter behavior and all twelve pinned SVGs
        run: node --test --experimental-test-coverage --test-coverage-include="scripts/asset-authoring/*.mjs" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=asset-authoring-coverage.info tests/asset-authoring/*.test.mjs
      - name: Enforce independent exporter module 80/80 coverage
        run: python scripts/check_asset_coverage.py asset-authoring-coverage.info
      - uses: actions/upload-artifact@v7
        with:
          name: asset-authoring-coverage-${{ matrix.os }}
          path: asset-authoring-coverage.info

  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Read candidate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content release/version.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid candidate version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test exact portable and installed release payload
        shell: pwsh
        run: ./scripts/Test-ApplicationRelease.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Upload failed synthetic drawing comparisons
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-acceptance-diagnostics
          path: release-acceptance-diagnostics/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: HEIMDALL-tested-release-candidate
          path: release-assets/*
          if-no-files-found: error
