name: CI

on:
  push:
    branches: [main]
  # Validate dependent PRs before their base feature branch is merged.
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    uses: ScottyMac52/shared-github-workflows/.github/workflows/reusable-dotnet-ci.yml@main
    with:
      dotnet_version: 10.0.x
      test_project: tests/Dcs.Ipia.Tests/Dcs.Ipia.Tests.csproj
      presentation_project: src/Dcs.Ipia.App/Dcs.Ipia.App.csproj
      coverage_include: '[Dcs.Ipia.Domain]*%2c[Dcs.Ipia.Application]*%2c[Dcs.Ipia.Infrastructure]*%2c[Dcs.Ipia.Dcs]*%2c[Dcs.Ipia.Rendering]*%2c[Dcs.Ipia.Packaging]*'
      line_threshold: 80
      branch_threshold: 80

  solution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Visual Studio solution
        run: dotnet build DCS-IPIA.sln --configuration Release
      - name: Run tests on Windows
        env:
          IPIA_PARITY_OUTPUT: ${{ runner.temp }}/huey-parity
        run: dotnet test tests/Dcs.Ipia.Tests/Dcs.Ipia.Tests.csproj --configuration Release --no-build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: huey-release-parity
          path: ${{ runner.temp }}/huey-parity
          if-no-files-found: warn
      - name: Open both WPF import previews
        run: dotnet run --project tests/Dcs.Ipia.App.Smoke/Dcs.Ipia.App.Smoke.csproj --configuration Release --no-build

  csharp-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check C# type and documentation layout
        run: python3 scripts/check_csharp_layout.py
      - name: Check WPF theme resource contract
        run: python3 scripts/check_theme_resources.py

      - name: Check pinned Common capability inventory
        run: python3 scripts/check_common_migration.py --check
      - name: Test migration inventory failure paths
        run: python3 -m unittest discover -s tests/migration -p 'test_*.py'

  asset-authoring:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test exporter behavior and all twelve pinned SVGs
        run: node --test --experimental-test-coverage --test-coverage-include="scripts/asset-authoring/*.mjs" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=asset-authoring-coverage.info tests/asset-authoring/*.test.mjs
      - name: Enforce independent exporter module 80/80 coverage
        run: python scripts/check_asset_coverage.py asset-authoring-coverage.info
      - uses: actions/upload-artifact@v7
        with:
          name: asset-authoring-coverage-${{ matrix.os }}
          path: asset-authoring-coverage.info

  release-candidate:
    needs: [dotnet, solution, csharp-layout, asset-authoring]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Read candidate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content release/version.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid candidate version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test exact portable and installed release payload
        shell: pwsh
        run: ./scripts/Test-ApplicationRelease.ps1 -Version '${{ steps.version.outputs.value }}'
      - uses: actions/upload-artifact@v7
        with:
          name: DCS-IPIA-tested-release-candidate
          path: release-assets/*
          if-no-files-found: error
