name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'
    branches: [main]
    paths: [release/version.json]

permissions:
  contents: read

jobs:
  quality:
    uses: ScottyMac52/shared-github-workflows/.github/workflows/reusable-dotnet-ci.yml@main
    with:
      dotnet_version: 10.0.x
      test_project: tests/Dcs.Ipia.Tests/Dcs.Ipia.Tests.csproj
      presentation_project: src/Dcs.Ipia.App/Dcs.Ipia.App.csproj
      coverage_include: '[Dcs.Ipia.Domain]*%2c[Dcs.Ipia.Application]*%2c[Dcs.Ipia.Infrastructure]*%2c[Dcs.Ipia.Dcs]*%2c[Dcs.Ipia.Rendering]*%2c[Dcs.Ipia.Packaging]*'
      line_threshold: 80
      branch_threshold: 80

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build solution and run Windows tests
        shell: pwsh
        run: |
          dotnet build DCS-IPIA.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Dcs.Ipia.Tests/Dcs.Ipia.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Dcs.Ipia.App.Smoke/Dcs.Ipia.App.Smoke.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_csharp_layout.py
      - run: python3 scripts/check_theme_resources.py
      - run: python3 scripts/check_common_migration.py --check
      - run: python3 -m unittest discover -s tests/migration -p 'test_*.py'

  release:
    needs: [quality, windows, inventory]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Resolve version and protect existing releases
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $tag = '${{ github.ref_name }}'
          } else {
            if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Release requests must be merged to main.' }
            $version = (Get-Content release/version.json -Raw | ConvertFrom-Json).version
            $tag = "v$version"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+\.\d+$') { throw 'Invalid four-component release tag.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = '${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/' + $tag
          try {
            $existing = Invoke-RestMethod -Uri $url -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($existing) { throw 'This release already exists; historical assets will not be replaced.' }
          if ('${{ github.ref }}' -eq 'refs/heads/main') {
            $tagUrl = '${{ github.api_url }}/repos/${{ github.repository }}/git/ref/tags/' + $tag
            try { $existingTag = Invoke-RestMethod -Uri $tagUrl -Headers $headers }
            catch { if ([int]$_.Exception.Response.StatusCode -ne 404) { throw } }
            if ($existingTag) { throw 'This tag already exists; choose a new release version.' }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "value=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Build and verify exact release artifacts
        shell: pwsh
        run: ./scripts/Test-ApplicationRelease.ps1 -Version '${{ steps.version.outputs.value }}'
      - uses: actions/upload-artifact@v7
        with:
          name: DCS-IPIA-${{ steps.version.outputs.tag }}-tested
          path: release-assets/*
          if-no-files-found: error
      - name: Publish tested artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DCS-IPIA ${{ steps.version.outputs.tag }}
          body_path: release/RELEASE-NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
